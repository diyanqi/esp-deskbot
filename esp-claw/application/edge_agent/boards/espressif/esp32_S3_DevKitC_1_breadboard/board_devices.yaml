version: 1.0.0
# Devices Configuration
devices:

  - name: led_strip
    chip: ws2812
    type: custom
    version: default
    init_skip: true
    dependencies:
      espressif/led_strip:
        version: "^3.0"
        public: true
    config:
      max_leds: 1                  # Number of LEDs in the strip
    peripherals:
      - name: rmt_tx               # RMT TX peripheral used by the LED strip

  - name: fake_audio_dac # Just for invoking audio dependencies, no actual DAC hardware connected
    chip: none
    type: audio_codec
    version: default
    init_skip: true
    peripherals:
      - name: i2s_audio_out

  # OV2640 over DVP 8-bit. The module has its own 24 MHz oscillator.
  # The esp32-camera based camera_snapshot Lua module reads this config and
  # drives the sensor itself, so esp_video must not initialize this device.
  - name: audio_dac
    type: custom
    version: default
    init_skip: true                 # No USB DAC fitted; also keeps USB-Serial-JTAG available
    dependencies:
      espressif/usb_host_uac: "^1.4.0"
    config:
      sample_rate_hz: 16000           # Sample rate in Hz

  - name: audio_adc
    type: custom
    version: default
    init_skip: true                 # No USB microphone fitted
    config:
      sample_rate_hz: 16000           # Sample rate in Hz


  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    config:
      mirror_x: false
      mirror_y: false
      swap_xy: true
      invert_color: false
      x_max: 320
      y_max: 240
      # esp_lcd_panel_io_spi_config_t fields
      io_spi_config:
        cs_gpio_num: 15
        dc_gpio_num: 7
        spi_mode: 0
        pclk_hz: 40000000

      lcd_panel_config:
        reset_gpio_num: 6
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_BGR
        data_endian: LCD_RGB_DATA_ENDIAN_LITTLE
        vendor_config: NULL
    peripherals:
      - name: spi_display
