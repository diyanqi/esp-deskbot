services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: data_collect
      POSTGRES_USER: data_collect
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_collect -d data_collect"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: .
    env_file:
      - .env
    environment:
      # Local compose database. Remove this override to use the external
      # PostgreSQL configured in .env.
      DATABASE_URL: postgres://data_collect:change-me@postgres:5432/data_collect?sslmode=disable
    ports:
      - "11294:11294"
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
